<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Avied - Live Cam</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
    }

    header {
      background: linear-gradient(to right, #1a1a1a, #003366);
      color: white;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    #video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 15px;
      padding: 15px;
    }

    .video-container {
      position: relative;
      background: black;
      border-radius: 10px;
      overflow: hidden;
    }

    video {
      width: 100%;
      border-radius: 10px;
    }

    .controls {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .controls button {
      background-color: rgba(255, 255, 255, 0.8);
      border: none;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .controls button:hover {
      background-color: #ffe000;
    }

    footer {
      background: #1a1a1a;
      color: white;
      text-align: center;
      padding: 10px;
      font-size: 14px;
    }

    .username-label {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      background: rgba(0, 0, 0, 0.5);
      padding: 2px 8px;
      border-radius: 5px;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Avied Live Streaming</h1>
    <div id="session-info">Code: <span id="sessionCode"></span> | Utilisateur: <span id="sessionUser"></span></div>
  </header>

  <main>
    <div id="video-grid">
      <!-- Caméra locale -->
      <div class="video-container" id="localCam">
        <span class="username-label" id="userLabel">Moi</span>
        <video id="myVideo" autoplay muted playsinline></video>
        <div class="controls">
          <button id="muteBtn"><i class="fas fa-microphone-slash"></i></button>
          <button id="screenShareBtn"><i class="fas fa-desktop"></i></button>
          <button id="returnCamBtn"><i class="fas fa-video"></i></button>
          <button id="raiseHandBtn"><i class="fas fa-hand-paper"></i></button>
          <button id="docBtn"><i class="fas fa-file-alt"></i></button>
        </div>
      </div>

      <!-- Membre connecté (exemple) -->
      <div class="video-container">
        <span class="username-label">Prof. Michel</span>
        <video autoplay muted playsinline src="sample-video.mp4"></video>
      </div>
    </div>
  </main>

  <footer>
    Avied Live - Plateforme de diffusion éducative
  </footer>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code') || 'Aucun';
    const user = urlParams.get('user') || 'Invité';

    document.getElementById('sessionCode').textContent = code;
    document.getElementById('sessionUser').textContent = user;
    document.getElementById('userLabel').textContent = user;

    const video = document.getElementById('myVideo');
    const muteBtn = document.getElementById('muteBtn');
    const screenShareBtn = document.getElementById('screenShareBtn');
    const returnCamBtn = document.getElementById('returnCamBtn');

    let isMuted = true;
    let stream;

    async function startCam() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        video.srcObject = stream;
      } catch (err) {
        alert('Erreur lors de l’accès à la caméra : ' + err.message);
      }
    }

    muteBtn.onclick = () => {
      isMuted = !isMuted;
      stream.getAudioTracks()[0].enabled = !isMuted;
      muteBtn.innerHTML = isMuted
        ? '<i class="fas fa-microphone-slash"></i>'
        : '<i class="fas fa-microphone"></i>';
    };

    screenShareBtn.onclick = async () => {
      try {
        const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
        video.srcObject = screenStream;
      } catch (err) {
        alert('Erreur de partage d\'écran');
      }
    };

    returnCamBtn.onclick = () => {
      if (stream) {
        video.srcObject = stream;
      }
    };

    // Les autres boutons peuvent être personnalisés ensuite
    document.getElementById('raiseHandBtn').onclick = () => alert("Demande de parole envoyée");
    document.getElementById('docBtn').onclick = () => alert("Afficher un document (à intégrer)");

    startCam();
  </script>

</body>
</html>
