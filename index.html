<!DOCTYPE html><html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diffusion Webcam - Avied</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: rgba(233, 239, 220, 0.8);
      margin: 0;
      padding: 0;
      text-align: center;
    }
    header {
      background: linear-gradient(to right, #1a1a1a, #003366);
      color: white;
      padding: 1rem;
    }
    .main-video {
      width: 80%;
      margin: 1rem auto;
      border: 2px solid #003366;
      border-radius: 10px;
    }
    .miniatures {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    .miniature {
      width: 120px;
      height: 90px;
      background: black;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .controls {
      margin: 1rem;
    }
    .controls button {
      margin: 0.5rem;
      padding: 0.5rem 1rem;
      background: linear-gradient(to right, #1a1a1a, #003366);
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .document-section {
      margin-top: 2rem;
    }
    iframe.document-viewer {
      width: 90%;
      height: 400px;
      border: 1px solid #003366;
      margin-top: 1rem;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <script>
  fetch("https://avied-online.great-site.net/trouve.html")
    .then(response => response.text())
    .then(mdpCorrect => {
      const saisie = prompt("Page protégée - entrez le mot de passe :");
      if (saisie !== mdpCorrect.trim()) {
        alert("Mot de passe incorrect.");
        window.location.href = "https://avied.netlify.app"; // page de secours
      }
    })
    .catch(err => {
      alert("Erreur de vérification de mot de passe.");
      window.location.href = "https://avied.netlify.app";
    });
</script>
  <header>
    <h1>Diffusion Webcam en Direct</h1>
  </header><video id="mainWebcam" class="main-video" autoplay muted playsinline></video>

  <div class="controls">
    <button onclick="startWebcam()">Démarrer Webcam</button>
    <button onclick="stopWebcam()">Arrêter Webcam</button>
    <button onclick="partagerDocument()">Afficher un Document</button>
    <input type="file" id="documentUploader" accept="application/pdf,.doc,.docx,.ppt,.pptx" style="display:none" onchange="previewDocument(event)">
  </div>  <div class="miniatures" id="miniaturesContainer">
    <!-- Miniatures des autres utilisateurs -->
    <div class="miniature"></div>
    <div class="miniature"></div>
    <div class="miniature"></div>
  </div>  <div class="document-section">
    <h3>Document en cours de diffusion</h3>
    <iframe id="documentViewer" class="document-viewer" style="display:none;"></iframe>
  </div>  <script>
    const videoElement = document.getElementById('mainWebcam');
    let webcamStream;

    function startWebcam() {
      navigator.mediaDevices.getUserMedia({ video: true, audio: true })
        .then(stream => {
          webcamStream = stream;
          videoElement.srcObject = stream;
        })
        .catch(err => alert("Erreur d'accès à la webcam : " + err.message));
    }

    function stopWebcam() {
      if (webcamStream) {
        webcamStream.getTracks().forEach(track => track.stop());
        videoElement.srcObject = null;
      }
    }

    function partagerDocument() {
      document.getElementById('documentUploader').click();
    }

    function previewDocument(event) {
      const file = event.target.files[0];
      if (file) {
        const fileURL = URL.createObjectURL(file);
        const viewer = document.getElementById('documentViewer');
        viewer.src = fileURL;
        viewer.style.display = 'block';
      }
    }
  </script>
  <button class="btn btn-danger" id="endStreamBtn">🛑 Terminer la diffusion</button>
  <script>
  document.getElementById('endStreamBtn').addEventListener('click', () => {
    if (confirm("Voulez-vous vraiment terminer la diffusion ?")) {
      // Redirige ou appelle un script PHP pour mettre à jour la base de données
      window.location.href = "terminer_diffusion.php"; // ou exécute une requête AJAX
    }
  });
</script>
  </body>
</html>
