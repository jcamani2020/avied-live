<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Diffusion Webcam - Avied</title>
  <style>
    /* Ton CSS ici (identique à ton exemple) */
  </style>
</head>
<body>
  <header>
    <h1>Diffusion Webcam en Direct</h1>
  </header>

  <div id="contenu" class="hidden">
    <video id="mainWebcam" class="main-video" autoplay muted playsinline></video>

    <div class="controls">
      <button onclick="startWebcam()">Démarrer Webcam</button>
      <button onclick="stopWebcam()">Arrêter Webcam</button>
      <button onclick="partagerDocument()">Afficher un Document</button>
      <input type="file" id="documentUploader" accept="application/pdf,.doc,.docx,.ppt,.pptx" style="display:none" onchange="previewDocument(event)">
    </div>

    <div class="miniatures" id="miniaturesContainer">
      <div class="miniature"></div>
      <div class="miniature"></div>
      <div class="miniature"></div>
    </div>

    <div class="document-section">
      <h3>Document en cours de diffusion</h3>
      <iframe id="documentViewer" class="document-viewer" style="display:none;"></iframe>
    </div>

    <button class="btn btn-danger" id="endStreamBtn">🛑 Terminer la diffusion</button>
  </div>

  <div id="erreur" style="margin-top: 2rem;"></div>

  <script>
    const videoElement = document.getElementById('mainWebcam');
    let webcamStream;

    function startWebcam() {
      navigator.mediaDevices.getUserMedia({ video: true, audio: true })
        .then(stream => {
          webcamStream = stream;
          videoElement.srcObject = stream;
        })
        .catch(err => alert("Erreur d'accès à la webcam : " + err.message));
    }

    function stopWebcam() {
      if (webcamStream) {
        webcamStream.getTracks().forEach(track => track.stop());
        videoElement.srcObject = null;
      }
    }

    function partagerDocument() {
      document.getElementById('documentUploader').click();
    }

    function previewDocument(event) {
      const file = event.target.files[0];
      if (file) {
        const fileURL = URL.createObjectURL(file);
        const viewer = document.getElementById('documentViewer');
        viewer.src = fileURL;
        viewer.style.display = 'block';
      }
    }

    document.getElementById('endStreamBtn').addEventListener('click', () => {
      if (confirm("Voulez-vous vraiment terminer la diffusion ?")) {
        window.location.href = "terminer_diffusion.html"; // version Netlify
      }
    });

    // Récupération du code depuis l'URL
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');

    if (code) {
      fetch(`https://tonsite.infinityfreeapp.com/api/verifier_diffusion.php?code=${code}`)
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            document.getElementById("contenu").classList.remove("hidden");
            // Tu peux aussi utiliser data.lien_video si besoin
          } else {
            document.getElementById("erreur").innerText = data.message;
          }
        })
        .catch(() => {
          document.getElementById("erreur").innerText = "Erreur de connexion au serveur.";
        });
    } else {
      document.getElementById("erreur").innerText = "Aucun code de diffusion fourni.";
    }
  </script>
</body>
</html>
