<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Live Cam - Avied</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: rgba(233, 239, 220, 0.8);
    }

    header {
      background: linear-gradient(to right, #1a1a1a, #003366);
      color: white;
      padding: 15px;
      text-align: center;
    }

    #main-video {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    video {
      width: 80%;
      max-width: 800px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    .controls {
      margin-top: 15px;
    }

    .controls button {
      margin: 5px;
      padding: 10px 15px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(to right, #1a1a1a, #003366);
      color: white;
      cursor: pointer;
    }

    .controls button i {
      margin-right: 8px;
    }

    #participants {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
      padding: 20px;
    }

    .participant {
      background: white;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      box-shadow: 0 0 5px rgba(0,0,0,0.3);
    }

    .participant video {
      width: 100%;
      border-radius: 8px;
    }

    .username {
      margin-top: 5px;
      font-weight: bold;
      color: #003366;
    }
  </style>
</head>
<body>

  <header>
    <h1>Session Live - Avied</h1>
  </header>

  <section id="main-video">
    <video id="myVideo" autoplay muted></video>

    <div class="controls">
      <button onclick="toggleMute()"><i class="fas fa-microphone-slash"></i>Mute</button>
      <button onclick="resizeVideo()"><i class="fas fa-expand-arrows-alt"></i>Taille</button>
      <button onclick="showDocument()"><i class="fas fa-file-alt"></i>Document</button>
      <button onclick="requestSpeak()"><i class="fas fa-hand-paper"></i>Demander la parole</button>
    </div>
  </section>

  <section id="participants">
    <!-- Exemples de participants -->
    <div class="participant">
      <video autoplay muted></video>
      <div class="username">ProfA</div>
    </div>
    <div class="participant">
      <video autoplay muted></video>
      <div class="username">Etudiant1</div>
    </div>
    <!-- Les autres participants seront ajoutés dynamiquement -->
  </section>

  <script>
    const video = document.getElementById('myVideo');

    // Accéder à la webcam
    navigator.mediaDevices.getUserMedia({ video: true, audio: true })
      .then(stream => {
        video.srcObject = stream;
      }).catch(err => {
        alert("Erreur d'accès à la caméra : " + err);
      });

    function toggleMute() {
      const stream = video.srcObject;
      if (stream) {
        stream.getAudioTracks().forEach(track => track.enabled = !track.enabled);
      }
    }

    function resizeVideo() {
      video.style.width = video.style.width === "100%" ? "80%" : "100%";
    }

    function showDocument() {
      alert("Fonction d'affichage de document à intégrer.");
    }

    function requestSpeak() {
      alert("Demande de parole envoyée.");
    }
  </script>

</body>
</html>
